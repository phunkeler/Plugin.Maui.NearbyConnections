#cloud-config
# Place this file at /boot/firmware/user-data on a freshly flashed
# Ubuntu Server 24.04 (arm64) before first boot.
#
# After boot completes (~5 min):
#   1. SSH in and run: sudo -u github-runner gh auth login --with-token < /dev/stdin
#   2. cd ~/appium/Plugin.Maui.NearbyConnections/docker && docker compose pull && docker compose up -d
#   3. Plug in Android device(s) and accept the USB debugging prompt on each screen

# ---------------------------------------------------------------------------
# Users
# ---------------------------------------------------------------------------
users:
  - name: sandlot
    groups: [sudo, plugdev, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false

  - name: github-runner
    groups: [plugdev]
    shell: /bin/bash
    lock_passwd: true
    no_create_home: false

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------
package_update: true
package_upgrade: true

packages:
  - adb
  - ca-certificates
  - curl
  - fail2ban
  - git
  - unattended-upgrades

# ---------------------------------------------------------------------------
# Docker (official apt source)
# ---------------------------------------------------------------------------
runcmd:
  # Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -q
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # GitHub CLI
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  - apt-get update -q && apt-get install -y gh

  # udev rule for Samsung Android devices (add more vendors as needed)
  - echo 'SUBSYSTEM=="usb", ATTR{idVendor}=="04e8", MODE="0666", GROUP="plugdev"' > /etc/udev/rules.d/51-android.rules
  - chmod a+r /etc/udev/rules.d/51-android.rules
  - udevadm control --reload-rules

  # Clone repo
  - git clone https://github.com/phunkeler/Plugin.Maui.NearbyConnections.git /home/sandlot/appium/Plugin.Maui.NearbyConnections
  - chown -R sandlot:sandlot /home/sandlot/appium

  # Enable services
  - systemctl daemon-reload
  - systemctl enable adb-server
  - systemctl start adb-server
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - systemctl enable unattended-upgrades

# ---------------------------------------------------------------------------
# Config files
# ---------------------------------------------------------------------------
write_files:
  # ADB systemd service
  - path: /etc/systemd/system/adb-server.service
    permissions: '0644'
    content: |
      [Unit]
      Description=ADB Server
      After=multi-user.target

      [Service]
      Type=simple
      User=sandlot
      ExecStartPre=-/usr/bin/adb kill-server
      ExecStart=/usr/bin/adb -a -P 5037 nodaemon server start
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

  # SSH hardening
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      PermitRootLogin no

  # UFW rules (applied via runcmd below)
  - path: /etc/ufw/applications.d/appium
    permissions: '0644'
    content: |
      [Appium]
      title=Appium
      description=Appium test server
      ports=4723/tcp

  # Unattended upgrades — enable timer
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Unattended upgrades — behavior
  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    permissions: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {};
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::SyslogEnable "true";
      Unattended-Upgrade::MinimalSteps "true";

# UFW must run after network is up — append to runcmd
# (cloud-init runs runcmd entries in order)
bootcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 4723/tcp
  - ufw --force enable
  # Disable USB autosuspend so Android devices stay connected via ADB
  - grep -q 'usbcore.autosuspend' /boot/firmware/cmdline.txt || sed -i 's/$/ usbcore.autosuspend=-1/' /boot/firmware/cmdline.txt
