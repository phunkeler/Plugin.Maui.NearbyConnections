name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    # Pinned to the same image as ci.yml. A release built on an image CI never validated is a
    # release nothing has actually tested — macos-latest silently moves between runner versions,
    # so this must be changed in lockstep with ci.yml, never independently.
    runs-on: macos-26-intel
    environment: nuget
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Required for MinVer to resolve the version from git tags

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore src/Plugin.Maui.NearbyConnections/Plugin.Maui.NearbyConnections.csproj

      - name: Build
        run: dotnet build src/Plugin.Maui.NearbyConnections/Plugin.Maui.NearbyConnections.csproj -c Release

      - name: Build tests
        run: dotnet build test/Plugin.Maui.NearbyConnections.UnitTests/Plugin.Maui.NearbyConnections.UnitTests.csproj -c Release

      - name: Test
        run: dotnet exec test/Plugin.Maui.NearbyConnections.UnitTests/bin/Release/net10.0/Plugin.Maui.NearbyConnections.UnitTests.dll

      # Runs before Pack so a known-vulnerable dependency stops the release rather than being
      # discovered after it is on nuget.org, where a package version can never be replaced.
      # Dependabot reports vulnerabilities eventually; it does not block a tag push.
      - name: Check for vulnerable dependencies
        run: |
          set -euo pipefail

          # `dotnet list package --vulnerable` exits 0 whether or not it finds anything, so the
          # output has to be parsed. Verified: exit code is 0 on a clean project.
          report=$(dotnet list src/Plugin.Maui.NearbyConnections/Plugin.Maui.NearbyConnections.csproj \
            package --vulnerable --include-transitive 2>&1)

          echo "$report"

          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable dependencies found. Release blocked."
            exit 1
          fi

          # A restore failure also produces no "vulnerable packages" line, which would let a
          # release through unchecked. Require positive confirmation that the scan actually ran.
          if ! echo "$report" | grep -q "no vulnerable packages"; then
            echo "::error::Vulnerability scan did not complete — treating as a failure rather than assuming clean."
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/Plugin.Maui.NearbyConnections/Plugin.Maui.NearbyConnections.csproj -c Release --output nupkgs /p:ContinuousIntegrationBuild=true

      - name: Login to NuGet.org (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: phunkeler

      - name: Push to NuGet.org
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease=${{ contains(github.ref_name, 'preview') }} \
            nupkgs/*.nupkg
