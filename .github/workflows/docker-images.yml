name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: phunkeler

jobs:
  build-runner:
    name: Build runner image
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'phunkeler'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/nearbyconnections-runner:latest

  build-appium:
    name: Build appium image
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'phunkeler'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push appium image
        uses: docker/build-push-action@v6
        with:
          context: docker/appium
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/nearbyconnections-appium:latest
