name: UI Tests

on:
  push:
    branches: [main, "*.*.*.preview.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: Build NearbyChat APK
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK
        run: dotnet build samples/NearbyChat/NearbyChat.csproj -f net10.0-android -c Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nearbychat-apk
          path: samples/NearbyChat/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error

  ui-tests:
    name: UI Tests (Pi device farm)
    runs-on: [self-hosted, linux, ARM64]
    if: github.repository_owner == 'phunkeler'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nearbychat-apk
          path: apk

      - name: Install APK on devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL }}
        run: |
          APK=$(find apk -name "*.apk" | head -1)
          echo "Installing $APK"
          adb -s "$DEVICE1_SERIAL" install -r "$APK"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            adb -s "$DEVICE2_SERIAL" install -r "$APK"
          fi

      - name: Check devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL }}
        run: |
          SERIALS="$DEVICE1_SERIAL"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            SERIALS="$SERIALS $DEVICE2_SERIAL"
          fi
          bash scripts/check-devices.sh $SERIALS

      - name: Run UI tests
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL }}
          APPIUM_SERVER_URL: ${{ secrets.APPIUM_SERVER_URL }}
        run: >
          dotnet run
          --project test/Plugin.Maui.NearbyConnections.UiTests
          --
          --settings test/Plugin.Maui.NearbyConnections.UiTests/NearbyConnections.runsettings

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: test/Plugin.Maui.NearbyConnections.UiTests/evidence/
          if-no-files-found: ignore
