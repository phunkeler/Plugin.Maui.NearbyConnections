name: UI Tests

on:
  push:
    branches: [main, "*.*.*.preview.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: Build NearbyChat APK
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore MAUI Android workload
        run: dotnet workload restore samples/NearbyChat/NearbyChat.csproj -p:TargetFrameworks=net10.0-android

      - name: Build APK
        run: dotnet build samples/NearbyChat/NearbyChat.csproj -f net10.0-android -c Debug -p:TargetFrameworks=net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nearbychat-apk
          path: samples/NearbyChat/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error

  ui-tests:
    name: UI Tests (Pi device farm)
    runs-on: [self-hosted, linux, ARM64]
    if: github.repository_owner == 'phunkeler'
    needs: build

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nearbychat-apk
          path: apk

      - name: Check devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
        run: |
          SERIALS="$DEVICE1_SERIAL"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            SERIALS="$SERIALS $DEVICE2_SERIAL"
          fi
          bash scripts/check-devices.sh $SERIALS

      - name: Install APK on devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
        run: |
          ADB="adb -H ${ANDROID_ADB_SERVER_HOST:-localhost} -P ${ANDROID_ADB_SERVER_PORT:-5037}"
          APK=$(find apk -name "*.apk" | head -1)
          echo "Installing $APK"
          $ADB -s "$DEVICE1_SERIAL" install -r "$APK"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            $ADB -s "$DEVICE2_SERIAL" install -r "$APK"
          fi

      - name: Run UI tests
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
          APPIUM_SERVER_URL: ${{ secrets.APPIUM_SERVER_URL }}
        run: >
          dotnet run
          --project test/Plugin.Maui.NearbyConnections.UiTests
          --
          --settings test/Plugin.Maui.NearbyConnections.UiTests/NearbyConnections.runsettings

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-evidence
          path: test/Plugin.Maui.NearbyConnections.UiTests/evidence/
          if-no-files-found: ignore
