name: UI Tests

on:
  push:
    branches: [main, "*.*.*.preview.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: Build NearbyChat APK
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore MAUI Android workload
        run: dotnet workload restore samples/NearbyChat/NearbyChat.csproj -p:TargetFrameworks=net10.0-android

      - name: Build APK
        run: dotnet build samples/NearbyChat/NearbyChat.csproj -f net10.0-android -c Debug -p:TargetFrameworks=net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nearbychat-apk
          path: samples/NearbyChat/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error

  ui-tests:
    name: UI Tests (Pi device farm)
    runs-on: [self-hosted, linux, ARM64]
    if: github.repository_owner == 'phunkeler'
    needs: build

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore tools
        run: |
          dotnet tool restore
          # XHarness bundles an x86_64 ADB binary; replace it with the system ARM64 one
          find "$HOME/.nuget/packages/microsoft.dotnet.xharness.cli" -name "adb" -exec cp "$(which adb)" {} \;

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nearbychat-apk
          path: apk

      - name: Check devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
        run: |
          SERIALS="$DEVICE1_SERIAL"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            SERIALS="$SERIALS $DEVICE2_SERIAL"
          fi
          bash scripts/check-devices.sh $SERIALS

      - name: Install APK on devices
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
        run: |
          APK=$(find apk -name "*.apk" | head -1)
          echo "Installing $APK"
          mkdir -p logs/xharness
          prepare_device() {
            local serial=$1
            adb -s "$serial" shell settings put global verifier_verify_adb_installs 0 || true
            adb -s "$serial" shell settings put global package_verifier_enable 0 || true
          }
          install_on_device() {
            dotnet tool run xharness android install \
              --app "$APK" \
              --package-name com.phunkeler.nearbychat \
              --device-id "$1" \
              --output-directory logs/xharness
          }
          prepare_device "$DEVICE1_SERIAL"
          install_on_device "$DEVICE1_SERIAL"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            prepare_device "$DEVICE2_SERIAL"
            install_on_device "$DEVICE2_SERIAL"
          fi

      - name: Start Appium
        run: |
          mkdir -p logs
          dotnet run --project test/Plugin.Maui.NearbyConnections.UiTests.AppHost -- --no-dashboard > logs/appium.log 2>&1 &
          echo "APPHOST_PID=$!" >> "$GITHUB_ENV"
          timeout 90 bash -c 'until curl -sf http://localhost:4723/status > /dev/null; do sleep 3; done'
          echo "Appium ready"

      - name: Start ADB logcat
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
        run: |
          mkdir -p logs
          adb -s "$DEVICE1_SERIAL" logcat -c
          adb -s "$DEVICE1_SERIAL" logcat > logs/logcat-device1.log 2>&1 &
          echo "LOGCAT1_PID=$!" >> "$GITHUB_ENV"
          if [[ -n "$DEVICE2_SERIAL" ]]; then
            adb -s "$DEVICE2_SERIAL" logcat -c
            adb -s "$DEVICE2_SERIAL" logcat > logs/logcat-device2.log 2>&1 &
            echo "LOGCAT2_PID=$!" >> "$GITHUB_ENV"
          fi

      - name: Run UI tests
        env:
          DEVICE1_SERIAL: ${{ secrets.DEVICE1_SERIAL }}
          DEVICE2_SERIAL: ${{ secrets.DEVICE2_SERIAL || '' }}
          APPIUM_SERVER_URL: http://localhost:4723
        run: >
          dotnet run
          --project test/Plugin.Maui.NearbyConnections.UiTests
          --
          --settings test/Plugin.Maui.NearbyConnections.UiTests/NearbyConnections.runsettings

      - name: Stop background processes
        if: always()
        run: |
          kill "$APPHOST_PID" 2>/dev/null || true
          kill "$LOGCAT1_PID" 2>/dev/null || true
          kill "${LOGCAT2_PID:-}" 2>/dev/null || true

      - name: Upload logs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-evidence
          path: |
            logs/
            test/Plugin.Maui.NearbyConnections.UiTests/evidence/
          if-no-files-found: ignore
