name: UI Tests

on:
  push:
    branches: [main, "0.3.0-preview.1"]
  pull_request:
    branches: [main, "0.3.0-preview.1"]
  workflow_dispatch:

jobs:

  build:
    name: Build NearbyChat APK
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache workload packs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v4
        with:
          path: |
            /usr/share/dotnet/packs
            /usr/share/dotnet/sdk-manifests
            /usr/share/dotnet/metadata
          key: workload-maui-android-${{ hashFiles('global.json') }}

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore Android dependencies
        run: dotnet restore samples/NearbyChat/NearbyChat.csproj -p:TargetFramework=net10.0-android

      - name: Build APK
        run: dotnet build samples/NearbyChat/NearbyChat.csproj -f net10.0-android -c Debug --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nearbychat-apk
          path: samples/NearbyChat/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: error
