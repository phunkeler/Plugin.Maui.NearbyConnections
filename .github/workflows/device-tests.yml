name: Device Tests

on:
  push:
    # TEMPORARY: this branch is listed so the workflow runs on push before it exists on main.
    # A workflow is only registered with Actions once it lands on the default branch, so
    # `gh workflow run` / workflow_dispatch 404 until then. Remove this branch before merging.
    branches: [main, merge/refactor-into-preview]
  pull_request:
    # Only the code these tests actually cover. Docs/sample-only PRs skip the whole workflow
    # rather than spending ~6 minutes of macOS runner time to re-prove an untouched suite.
    paths:
      - 'src/Plugin.Maui.NearbyConnections/**'
      - 'test/Plugin.Maui.NearbyConnections.DeviceTests/**'
      - 'test/Plugin.Maui.NearbyConnections.DeviceTests.Runner/**'
      - 'scripts/device-tests.ps1'
      - '.github/workflows/device-tests.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

# Results are rendered into the run summary by scripts/trx-summary.ps1, so no check-run
# write access is needed -- the workflow only reads the repository.
permissions:
  contents: read

jobs:

  read-api-levels:
    name: Read Android API levels
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      levels: ${{ steps.read.outputs.levels }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # .config/android-api-levels.json is the single source of truth for which Android API
      # levels this suite tests -- read here so the matrix below and a local
      # ./scripts/device-tests.ps1 run resolve latest/common/minimum to the same numbers.
      - id: read
        run: echo "levels=$(jq -c '[.latest,.common,.minimum]' .config/android-api-levels.json)" >> "$GITHUB_OUTPUT"

  android:
    name: Android emulator (API ${{ matrix.level }})
    needs: read-api-levels
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'
    # Covers a cold AVD-cache-miss create (~80s) + boot + the actual test run -- 5 min was cut
    # before "Run device tests on emulator" ever started on a cache miss.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJson(needs.read-api-levels.outputs.levels) }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Ubuntu 24.04 uses the XDG convention (~/.config/.android/avd) but avdmanager/emulator's
      # search order is $ANDROID_AVD_HOME, then $ANDROID_SDK_HOME/avd, then $HOME/.android/avd --
      # unset, `avd create` can write somewhere the emulator never looks, so it succeeds (exit 0)
      # while `avd start` reports "Unknown AVD name" against an AVD that does exist, just not
      # where it's searched. Exporting to $GITHUB_ENV (not a job-level `env:` block, which can't
      # see the runner's real $HOME at YAML-evaluation time) makes every later step -- create,
      # start, and the AVD cache path -- agree on one location.
      - name: Pin ANDROID_AVD_HOME / ANDROID_SDK_HOME
        run: |
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$HOME/.android" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache workload packs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            /usr/share/dotnet/packs
            /usr/share/dotnet/sdk-manifests
            /usr/share/dotnet/metadata
          key: workload-maui-android-${{ hashFiles('global.json') }}
          restore-keys: workload-maui-android-

      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.level }}-x86_64-google_apis
          restore-keys: avd-${{ matrix.level }}-

      # AVD create + boot + the test run all happen inside device-tests.ps1's Invoke-AndroidTests,
      # the same single source of truth a local run uses -- it already skips create/install when
      # `avd list` shows the AVD present (the cache-hit case) and auto-detects arch/gpu from the
      # host ($env:CI on this runner selects --no-window and --gpu swiftshader_indirect).
      - name: Run device tests on emulator
        run: pwsh ./scripts/device-tests.ps1 -Platform android -AndroidApiLevel ${{ matrix.level }}

      # always(), not !cancelled(): these must run even when an earlier step failed, which is
      # exactly the case that needs diagnosing. mkdir -p guarantees the upload has a path.
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools/adb" logcat -d > artifacts/logcat.txt 2>/dev/null || true
          dotnet workload list > artifacts/workloads.txt 2>&1 || true
          echo "--- artifacts ---"; ls -la artifacts/

      - name: Write run summary
        if: always()
        run: pwsh ./scripts/trx-summary.ps1 -Path artifacts/device-android-${{ matrix.level }}.trx -Title 'Android API ${{ matrix.level }}' >> $GITHUB_STEP_SUMMARY

      - name: Upload TRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-tests-android-${{ matrix.level }}
          path: artifacts/
          if-no-files-found: warn

  ios:
    name: iOS simulator
    runs-on: macos-15
    if: github.repository_owner == 'phunkeler'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # macOS runners install .NET under /usr/local/share/dotnet, not /usr/share/dotnet as on
      # ubuntu — caching the Linux path here would silently store nothing.
      - name: Cache workload packs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            /usr/local/share/dotnet/packs
            /usr/local/share/dotnet/sdk-manifests
            /usr/local/share/dotnet/metadata
          key: workload-maui-ios-${{ hashFiles('global.json') }}

      - name: Install iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update

      # The .NET iOS SDK pins an exact required Xcode major.minor -- NOT a minimum, so "always
      # pick the newest installed" is wrong in both directions: this repo has hit both "requires
      # Xcode 26.6, found 26.5" (newest too old) and "requires Xcode 26.0, found 26.3" (newest too
      # new). The pack's own Versions.plist (RecommendedXcodeVersion) is the SDK's authoritative
      # statement of what it needs -- read after "Install iOS workload" populates the pack, not
      # before. A fresh CI runner installs exactly one Microsoft.iOS.Sdk.net10.0_* pack (global.json
      # pins the SDK exactly, rollForward: disable) -- fail loudly rather than guess if more than
      # one is ever found, since picking the wrong one silently selects the wrong Xcode.
      - name: Select matching Xcode
        run: |
          set -euo pipefail
          packs=$(ls -d /usr/local/share/dotnet/packs/Microsoft.iOS.Sdk.net10.0_*/*/ 2>/dev/null || true)
          packCount=$(echo "$packs" | grep -c . || true)
          if [ "$packCount" -eq 0 ]; then
            echo "No Microsoft.iOS.Sdk.net10.0_* pack found under /usr/local/share/dotnet/packs." >&2
            echo "Installed packs:" >&2
            ls -d /usr/local/share/dotnet/packs/*/ >&2 || true
            exit 1
          fi
          if [ "$packCount" -gt 1 ]; then
            echo "Found $packCount Microsoft.iOS.Sdk.net10.0_* packs, expected exactly one on a fresh runner:" >&2
            echo "$packs" >&2
            exit 1
          fi
          required=$(plutil -extract RecommendedXcodeVersion raw "${packs}Versions.plist" 2>/dev/null || true)
          if [ -z "$required" ]; then
            echo "Could not determine required Xcode version from installed packs; falling back to newest installed."
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          else
            echo "Workload requires Xcode $required"
            match=$(ls -d /Applications/Xcode_${required}*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$match" ]; then
              echo "No installed Xcode matches $required; run 'ls /Applications' on the runner to see what's available." >&2
              exit 1
            fi
            sudo xcode-select -s "$match"
          fi
          xcodebuild -version

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tool package lands in ~/.nuget/packages, so the cache step above covers it too.
      - name: Restore dotnet tools
        run: dotnet tool restore

      # Boot the simulator in the background so it warms up while the app builds, instead of
      # the script paying the boot serially at test time. Same two CLI commands
      # scripts/device-tests.ps1 runs, so this is idempotent -- the script's own setup is a fast
      # no-op afterwards. --no-open is headless, which is what CI wants -- device-tests.ps1 also
      # skips launching Simulator.app when $CI is set.
      - name: Pre-boot simulator
        run: |
          set -euo pipefail
          # devicetypes is already newest-first, so index 0 is the newest iPhone (verified locally:
          # iPhone 17 Pro precedes iPhone 6s Plus) -- omit --runtime so the CLI picks the newest
          # installed runtime that supports it.
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes | map(select(.name | test("^iPhone"))) | .[0].identifier')
          UDID=$(dotnet maui apple simulator create "$DEVICE_TYPE" --name device-tests --if-not-exists --json | jq -r '.udid')
          echo "Booting $UDID"
          # `simulator start` errors (exit 1) on an already-booted device -- --if-not-exists can
          # hand back a UDID that's already running, so this tolerates that specific case rather
          # than failing the job over it.
          dotnet maui apple simulator start "$UDID" --no-open || true

      - name: Run device tests on simulator
        run: pwsh ./scripts/device-tests.ps1 -Platform ios

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl spawn booted log collect --output artifacts/simulator.logarchive 2>/dev/null || true
          dotnet workload list > artifacts/workloads.txt 2>&1 || true
          echo "--- artifacts ---"; ls -la artifacts/

      - name: Write run summary
        if: always()
        run: pwsh ./scripts/trx-summary.ps1 -Path artifacts/device-ios.trx -Title 'iOS' >> $GITHUB_STEP_SUMMARY

      - name: Upload TRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-tests-ios
          path: artifacts/
          if-no-files-found: warn
