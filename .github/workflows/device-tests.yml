name: Device Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter creates a check run against the commit.
permissions:
  contents: read
  checks: write

jobs:

  android:
    name: Android emulator
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache workload packs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            /usr/share/dotnet/packs
            /usr/share/dotnet/sdk-manifests
            /usr/share/dotnet/metadata
          key: workload-maui-android-${{ hashFiles('global.json') }}
          restore-keys: workload-maui-android-

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: pwsh ./eng/device-tests.ps1 -Platform android

      - name: Publish results check
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Device Tests (Android)
          path: artifacts/device-android.trx
          reporter: dotnet-trx

      - name: Upload TRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: device-tests-android
          path: artifacts/
          if-no-files-found: error

  ios:
    name: iOS simulator
    runs-on: macos-15
    if: github.repository_owner == 'phunkeler'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # The .NET iOS SDK pins a minimum Xcode; the newest installed on the runner is the one most
      # likely to satisfy it (locally this repo has hit "requires Xcode 26.6, found 26.5").
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      # macOS runners install .NET under /usr/local/share/dotnet, not /usr/share/dotnet as on
      # ubuntu — caching the Linux path here would silently store nothing.
      - name: Cache workload packs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            /usr/local/share/dotnet/packs
            /usr/local/share/dotnet/sdk-manifests
            /usr/local/share/dotnet/metadata
          key: workload-maui-ios-${{ hashFiles('global.json') }}
          restore-keys: workload-maui-ios-

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run device tests on simulator
        run: pwsh ./eng/device-tests.ps1 -Platform ios

      - name: Publish results check
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Device Tests (iOS)
          path: artifacts/device-ios.trx
          reporter: dotnet-trx

      - name: Upload TRX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: device-tests-ios
          path: artifacts/
          if-no-files-found: error
