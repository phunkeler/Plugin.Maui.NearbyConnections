services:

  appium:
    image: ghcr.io/phunkeler/nearbyconnections-appium:latest
    ports:
      - "4723:4723"
    environment:
      - ANDROID_ADB_SERVER_HOST=host-gateway
      - ANDROID_ADB_SERVER_PORT=5037
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  runner:
    image: ghcr.io/phunkeler/nearbyconnections-runner:latest
    environment:
      - REPO_OWNER=phunkeler
      - REPO_NAME=Plugin.Maui.NearbyConnections
      - RUNNER_NAME=pi-device-farm
      - RUNNER_LABELS=self-hosted,linux,ARM64
      - ANDROID_ADB_SERVER_HOST=host-gateway
      - ANDROID_ADB_SERVER_PORT=5037
    volumes:
      # Share host gh CLI auth so the container can call the GitHub API without a stored PAT
      - /home/github-runner/.config/gh:/home/runner/.config/gh:ro
    extra_hosts:
      - "host-gateway:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/runner/_work
      - /home/runner/.runner
      - /home/runner/.credentials
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
