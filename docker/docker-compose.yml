services:

  # Appium is no longer a long-running service here.
  # It is started ephemerally by the AppHost project in each CI run:
  #   test/Plugin.Maui.NearbyConnections.UiTests.AppHost

  runner:
    image: ghcr.io/phunkeler/nearbyconnections-runner:latest
    network_mode: host
    environment:
      - REPO_OWNER=phunkeler
      - REPO_NAME=Plugin.Maui.NearbyConnections
      - RUNNER_NAME=pi-device-farm
      - RUNNER_LABELS=self-hosted,linux,ARM64
      - ANDROID_ADB_SERVER_HOST=127.0.0.1
      - ANDROID_ADB_SERVER_PORT=5037
    volumes:
      # Share host gh CLI auth so the container can call the GitHub API without a stored PAT
      - /home/github-runner/.config/gh:/home/runner/.config/gh:ro
      # Persist ADB keys so the same key survives container restarts — device only needs authorizing once
      - /home/github-runner/.android:/home/runner/.android
    restart: always
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
